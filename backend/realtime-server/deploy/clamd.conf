Foreground yes
LogTime yes
LogFile /dev/stdout
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
User clamav
MaxThreads 4
MaxQueue 16
ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 10
StreamMaxLength 11M
MaxFileSize 11M
MaxScanSize 100M
MaxRecursion 12
MaxFiles 1000
AlertEncrypted yes
AlertExceedsMax yes
