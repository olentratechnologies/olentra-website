name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Build and consistency checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install website, admin and package dependencies
        run: npm ci

      - name: Install backend dependencies
        run: |
          bun install --cwd backend/email-server --frozen-lockfile
          bun install --cwd backend/realtime-server --frozen-lockfile

      - name: Check naming, routes, and documentation
        run: npm run test:naming

      - name: Build website and admin apps
        run: npm run build

      - name: Run email tests
        run: npm run email:test

      - name: Run website unit tests
        run: node --test apps/web/scripts/*.test.mjs

      - name: Start MongoDB test replica set
        run: |
          docker run -d --name mongo-test -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            docker exec mongo-test mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo-test mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for attempt in $(seq 1 30); do
            [ "$(docker exec mongo-test mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 2
          done

      # Runs the web presence tests, backend unit/contract tests, and the
      # internship integration tests against the throwaway replica set above.
      - name: Run presence, realtime and internship integration tests
        env:
          INTERNSHIP_TEST_MONGODB_URI: mongodb://localhost:27017/olentra_ci_test?replicaSet=rs0&directConnection=true
          EMAIL_DELIVERY_TOKEN: ''
        run: npm run presence:test

      - name: Run company workspace tests
        run: npm run test:admin

      - name: Typecheck realtime server
        run: npm run realtime:typecheck
