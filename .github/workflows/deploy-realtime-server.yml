name: Deploy Realtime Server

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'backend/realtime-server/**'
      - '.github/workflows/deploy-realtime-server.yml'
  workflow_dispatch:
    inputs:
      configure_admin_domain:
        description: Add the company admin domain to backend origins and reset links
        type: boolean
        default: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: backend/realtime-server
        run: bun install --frozen-lockfile

      - name: Run realtime unit and contract tests
        working-directory: backend/realtime-server
        run: bun test tests/unit tests/contract tests/integration/presence-realtime.test.ts

      - name: Typecheck realtime server
        working-directory: backend/realtime-server
        run: bun run typecheck

  deploy:
    name: Deploy to Oracle Cloud
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLENTRA_REPOSITORY: ${{ github.repository }}
          CONFIGURE_ADMIN_DOMAIN: ${{ inputs.configure_admin_domain && 'true' || 'false' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,OLENTRA_REPOSITORY,CONFIGURE_ADMIN_DOMAIN
          script: |
            set -Eeuo pipefail

            APP_DIR="${OLENTRA_APP_DIR:-$HOME/olentra-website}"
            SERVICE_DIR="$APP_DIR/backend/realtime-server"
            ENV_FILE="${OLENTRA_ENV_FILE:-$SERVICE_DIR/.env}"
            FALLBACK_ENV_FILE="/etc/olentra/realtime-server.env"
            SERVICE_NAME="olentra-realtime"
            REPOSITORY="https://github.com/${OLENTRA_REPOSITORY}.git"
            command -v git >/dev/null || { echo "git is required on the deployment host"; exit 1; }
            command -v bun >/dev/null || { echo "Bun is required on the deployment host"; exit 1; }
            command -v sudo >/dev/null || { echo "sudo is required on the deployment host"; exit 1; }
            command -v systemctl >/dev/null || { echo "systemd is required on the deployment host"; exit 1; }
            command -v curl >/dev/null || { echo "curl is required on the deployment host"; exit 1; }

            askpass=""
            cleanup() { [ -z "$askpass" ] || rm -f "$askpass"; }
            trap cleanup EXIT
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              askpass="$(mktemp)"
              cat > "$askpass" <<'ASKPASS'
            #!/bin/sh
            case "$1" in
              *Username*) printf '%s\n' x-access-token ;;
              *) printf '%s\n' "$GITHUB_TOKEN" ;;
            esac
            ASKPASS
              chmod 700 "$askpass"
              export GIT_ASKPASS="$askpass"
              export GIT_TERMINAL_PROMPT=0
            fi

            if [ -e "$APP_DIR" ] && [ ! -d "$APP_DIR/.git" ]; then
              echo "Deployment path exists but is not a Git checkout: $APP_DIR"
              exit 1
            fi
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch main --single-branch "$REPOSITORY" "$APP_DIR"
            else
              git -C "$APP_DIR" remote set-url origin "$REPOSITORY"
              git -C "$APP_DIR" fetch origin main
              git -C "$APP_DIR" switch main
              git -C "$APP_DIR" pull --ff-only origin main
            fi

            if [ ! -f "$ENV_FILE" ] && [ -f "$FALLBACK_ENV_FILE" ]; then
              ENV_FILE="$FALLBACK_ENV_FILE"
            fi
            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing realtime production environment file: $ENV_FILE"
              echo "Create it on the host or set the OLENTRA_ENV_FILE SSH environment value."
              exit 1
            fi

            cd "$SERVICE_DIR"
            bun install --frozen-lockfile
            bun run build

            deploy_user="$(id -un)"
            bun_path="$(command -v bun)"
            if [ "${CONFIGURE_ADMIN_DOMAIN:-false}" = "true" ]; then
              # Read and edit the secret-bearing file only on the host. Preserve
              # other settings, ownership and mode; retain a private backup.
              sudo "$bun_path" -e '
                const fs = require("node:fs");
                const { randomUUID } = require("node:crypto");
                const file = fs.realpathSync(process.argv[1]);
                const source = fs.readFileSync(file, "utf8");
                const lines = source.split(/\r?\n/);
                const decode = raw => {
                  const value = raw.trim().replace(/[ \t]+#.*$/, "").trim(), quote = value.charCodeAt(0);
                  return (quote === 34 || quote === 39) && value.at(-1) === value[0] ? value.slice(1, -1) : value;
                };
                const values = Object.fromEntries(lines.flatMap(line => {
                  const match = line.match(/^[ \t]*(?:export[ \t]+)?([A-Z_]+)[ \t]*=[ \t]*(.*)$/);
                  return match ? [[match[1], decode(match[2])]] : [];
                }));
                const origin = "https://admin.olentratechnologies.com";
                const existing = values.REALTIME_ALLOWED_ORIGINS || values.INTERNSHIP_ALLOWED_ORIGINS || values.INTERN_ALLOWED_ORIGINS || values.ALLOWED_ORIGINS || "http://localhost:3000,http://127.0.0.1:3000";
                const origins = existing.split(",").map(value => value.trim()).filter(Boolean);
                if (!origins.some(value => value.toLowerCase() === origin)) origins.push(origin);
                const replacements = { REALTIME_ALLOWED_ORIGINS: origins.join(","), INTERNSHIP_WORKSPACE_ORIGIN: origin };
                const seen = new Set();
                const updatedLines = lines.map(line => {
                  const match = line.match(/^[ \t]*(?:export[ \t]+)?(REALTIME_ALLOWED_ORIGINS|INTERNSHIP_WORKSPACE_ORIGIN)[ \t]*=/);
                  if (!match) return line;
                  seen.add(match[1]);
                  return match[1] + "=" + replacements[match[1]];
                });
                for (const [key, value] of Object.entries(replacements)) if (!seen.has(key)) {
                  if (updatedLines.at(-1) === "") updatedLines.pop();
                  updatedLines.push(key + "=" + value, "");
                }
                const updated = updatedLines.join(source.includes("\r\n") ? "\r\n" : "\n");
                if (updated === source) { console.info("Admin domain configuration already matches."); process.exit(0); }
                const stat = fs.statSync(file), tag = Date.now() + "." + randomUUID();
                const backup = file + ".before-admin-domain." + tag + ".bak", temp = file + ".admin-domain." + tag + ".tmp";
                try {
                  fs.copyFileSync(file, backup, fs.constants.COPYFILE_EXCL);
                  fs.chownSync(backup, stat.uid, stat.gid); fs.chmodSync(backup, stat.mode & 0o777);
                  fs.writeFileSync(temp, updated, { flag: "wx", mode: stat.mode & 0o777 });
                  fs.chownSync(temp, stat.uid, stat.gid); fs.chmodSync(temp, stat.mode & 0o777);
                  fs.renameSync(temp, file);
                } finally { fs.rmSync(temp, { force: true }); }
                console.info("Configured the admin domain; environment backup: " + backup);
              ' "$ENV_FILE"
            fi
            sudo tee "/etc/systemd/system/${SERVICE_NAME}.service" >/dev/null <<UNIT
            [Unit]
            Description=Olentra unified realtime server
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=${deploy_user}
            WorkingDirectory=${SERVICE_DIR}
            EnvironmentFile=${ENV_FILE}
            ExecStart=${bun_path} dist/realtime-server.js
            Restart=always
            RestartSec=5
            KillSignal=SIGINT
            TimeoutStopSec=30
            NoNewPrivileges=true
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            UNIT

            sudo systemctl daemon-reload
            sudo systemctl enable "$SERVICE_NAME"
            sudo systemctl restart "$SERVICE_NAME"

            realtime_port="$(awk -F= '$1 == "REALTIME_PORT" {print $2; exit}' "$ENV_FILE" | tr -d "[:space:]\"'")"
            realtime_port="${realtime_port:-3003}"
            case "$realtime_port" in
              ''|*[!0-9]*) echo "Invalid REALTIME_PORT in $ENV_FILE"; exit 1 ;;
            esac

            for attempt in $(seq 1 60); do
              health_code="$(curl --silent --show-error --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${realtime_port}/health" || true)"
              internship_code="$(curl --silent --show-error --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${realtime_port}/intern/health" || true)"
              if [ "$health_code" = "200" ] && [ "$internship_code" = "200" ]; then
                echo "Realtime deployment healthy on port $realtime_port"
                exit 0
              fi
              sleep 1
            done

            echo "Realtime deployment failed health checks: /health=$health_code /intern/health=$internship_code"
            sudo systemctl status "$SERVICE_NAME" --no-pager || true
            sudo journalctl -u "$SERVICE_NAME" -n 80 --no-pager || true
            exit 1
