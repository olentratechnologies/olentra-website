name: Deploy WebSocket Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/websockets/**'
      - '.github/workflows/deploy-websocket.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: backend/websockets
        run: bun install

      - name: Run presence & server tests
        working-directory: backend/websockets
        run: bun test --path-ignore-patterns '**/intern/**' src/presence.test.ts server.test.ts

  deploy:
    name: Deploy to Oracle Cloud
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /home/ubuntu/deploy-websocket.sh
